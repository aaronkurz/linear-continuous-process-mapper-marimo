name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.1

      - name: Set up Python 🐍
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies 📦
        run: uv sync

      - name: Run tests 🧪
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      already-published: ${{ steps.version-check.outputs.already-published }}
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.1

      - name: Set up Python 🐍
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Check if version already published 🔍
        id: version-check
        run: |
          NAME=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['name'])")
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/$NAME/$VERSION/json)
          if [ "$STATUS" = "200" ]; then
            echo "already-published=true" >> $GITHUB_OUTPUT
          else
            echo "already-published=false" >> $GITHUB_OUTPUT
          fi

      # Built on pull requests too, so a packaging error shows up before the merge.
      - name: Build 🏗️
        run: uv build

      - name: Upload dist artifacts 📤
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.already-published == 'false'
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts 📥
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Publish to PyPI 🚀
        run: uv publish
