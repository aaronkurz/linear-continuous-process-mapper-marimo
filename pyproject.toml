[project]
name = "linear-continuous-process-mapper"
version = "0.1.0"
description = "Linear continuous process maps of event logs as Plotly Sankey figures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ICS University St. Gallen" }]
keywords = ["process mining", "event log", "process map", "sankey"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pandas>=2.2",
    "plotly>=5.20",
    "pm4py>=2.7.11",
]

[project.optional-dependencies]
# The interactive marimo notebook (marimo_app.py) and static image export.
notebook = ["marimo>=0.21.1", "kaleido>=1.0.0"]

[project.urls]
Homepage = "https://github.com/aaronkurz/linear-continuous-process-mapper-marimo"
Repository = "https://github.com/aaronkurz/linear-continuous-process-mapper-marimo"

[dependency-groups]
dev = [
    "pytest",
    "marimo>=0.21.1",
    "kaleido>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lcm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
